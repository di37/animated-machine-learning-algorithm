[project]
name = "house-price-manim-lessons"
version = "0.1.0"
description = "The California house-price lesson videos, played with Manim"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The lessons (house_anim), their engine (animkit) and the Manim player (manimkit) live in sibling folders.
pythonpath = [".", "../ml_animation_kit", "../manim_lesson_kit", "../house_price_animations"]
# The base conda env ships a logfire plugin that fails to import against its opentelemetry.
addopts = "-p no:logfire"
filterwarnings = [
    # Spurious FP-flag warnings from numpy + Apple Accelerate on finite data; see animkit/cli.py.
    "ignore:.*encountered in matmul:RuntimeWarning",
]

[tool.coverage.run]
source = ["house_manim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
